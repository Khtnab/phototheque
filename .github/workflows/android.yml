name: Construire l'appli Android

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - run: npm install --no-audit --no-fund
      - name: Générer le projet Android
        run: npx expo prebuild --platform android --no-install
      - name: Compiler l'APK
        working-directory: android
        run: ./gradlew assembleRelease --no-daemon
      - name: Renommer
        run: cp android/app/build/outputs/apk/release/app-release.apk Phototheque.apk
      - name: Publier la version
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.run_number }}
          name: Photothèque version ${{ github.run_number }}
          body: Télécharge Phototheque.apk ci-dessous sur ton téléphone Android pour installer ou mettre à jour l'appli.
          files: Phototheque.apk
          make_latest: true
